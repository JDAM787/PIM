# Postgres local para desarrollo. Arranca con: npm run db:up
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pim
    ports:
      - '5432:5432'
    volumes:
      - pim-postgres:/var/lib/postgresql/data

volumes:
  pim-postgres:
